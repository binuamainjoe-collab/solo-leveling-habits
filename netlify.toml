[build]
  # Expo's web export writes a static site to dist/.
  command = "npx expo export --platform web"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "22"

# Expo Router emits a real .html for every known route, and Netlify serves a
# matching file before it consults redirects — so this only catches what is
# left: an unknown path, or a client-side navigation deep-linked straight in.
# Without it those return a bare 404 instead of the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The bundle and assets are content-hashed, so they can be cached hard. The
# HTML must not be, or a returning student keeps the old shell and loads
# JavaScript that no longer exists.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
