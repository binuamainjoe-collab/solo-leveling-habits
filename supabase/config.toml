# Supabase project config.
#
# `project_id` is just the local folder label; the deployed project is linked
# separately with `supabase link`.
project_id = "solo-leveling-habits"

[functions.plan-tomorrow]
# Predates Google sign-in and is still callable by a signed-out student, so
# there is no JWT to check. The gate is the `x-app-secret` header plus the
# server-side daily cap.
verify_jwt = false

# The two below are the opposite case: they exist to act on behalf of one
# identified account, so the JWT is the whole point. The user id is always
# taken from the verified token, never from the request body.
[functions.google-link]
verify_jwt = true

[functions.google]
verify_jwt = true

# The shadow army. Same gate as plan-tomorrow: no Supabase users are involved,
# so there is no JWT to verify — the `x-app-secret` header plus the shared
# 30-a-day cap is the whole protection.
[functions.beru-scout]
verify_jwt = false

[functions.igris-judge]
verify_jwt = false

# Not an agent — no model calls, no budget. It exists so the app can reach
# tables that are service-role only.
[functions.goal-api]
verify_jwt = false

# The supervisor and the snapshot sink. Same x-app-secret gate; the cron job
# that calls steward-report presents the secret from Vault.
[functions.steward-report]
verify_jwt = false

[functions.log-snapshot]
verify_jwt = false
