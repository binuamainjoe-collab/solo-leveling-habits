# Supabase project config.
#
# `project_id` is just the local folder label; the deployed project is linked
# separately with `supabase link`.
project_id = "solo-leveling-habits"

# Every function acts for one signed-in account. Each one checks the caller's
# Supabase session token itself (`caller()` in _shared/agent.ts; plan-tomorrow
# keeps its own copy) and then reads and writes with that token, so the row
# rules in the database limit it to that account's rows. The user id always
# comes from the verified token, never from the request body.
#
# The gateway's JWT check is off for the functions the browser calls with a
# CORS preflight, because the preflight carries no token; the check in code
# is the gate. There is no shared app secret any more.

[functions.plan-tomorrow]
verify_jwt = false

[functions.assistant]
verify_jwt = false

[functions.live]
verify_jwt = false

[functions.profile]
verify_jwt = false

[functions.goal-api]
verify_jwt = false

[functions.log-snapshot]
verify_jwt = false

# The shadow army. Beru passes its caller's token on when it raises Igris.
[functions.beru-scout]
verify_jwt = false

[functions.igris-judge]
verify_jwt = false

# The supervisor: a report on the signed-in account alone. Email goes only to
# REPORT_TO_EMAIL, and only for that address's own account.
[functions.steward-report]
verify_jwt = false

[functions.google-link]
verify_jwt = true

[functions.google]
verify_jwt = true
